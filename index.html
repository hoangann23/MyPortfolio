<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3D Model Loader</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <h1>My 3D Modeling Progress</h1>
        <div id="window" style="display: flex; gap: 10px; height: 100vh; margin-top: 10px; margin-left: 1%; margin-right: 1%">
            <div id="days"></div>
            <div id="canvas">
                <canvas class="webgl" id="webgl" style="flex: 1;"></canvas>
                <div id="sliderscontainer"></div>
            </div>
        </div>
    
    <script src="./js/constants.js"></script>
    <script src="./js/loadImages.js"></script>
    <script src="./js/sliders.js"></script>

    <script src="./js/displayImages.js"></script>

        <script type="importmap">
        {
            "imports": {
                "three": "./three.js-master/build/three.module.js"
            }
        }
        </script>
    <script type="module" src="./js/render.js"></script>
    <script>
        const canvas = document.getElementById('webgl');
        canvas.addEventListener('mousedown', function() {
            if (document.getElementById('camerasliders')) {
                updateCameraSliders();
                if (getIsLightAttachedToCamera()) {
                    updateLightSlidersToMatchCamera();
                }
            }
        });
        canvas.addEventListener('mouseup', function() {
            if (document.getElementById('camerasliders')) {
                updateCameraSliders();
                if (getIsLightAttachedToCamera()) {
                    updateLightSlidersToMatchCamera();
                }
            }
        });
        canvas.addEventListener('wheel', function() {
            if (document.getElementById('camerasliders')) {
                updateCameraSliders();
                if (getIsLightAttachedToCamera()) {
                    updateLightSlidersToMatchCamera();
                }
            }
        });
    </script>
    </body>
</html>
